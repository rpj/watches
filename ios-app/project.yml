# XcodeGen spec for Wrist. The generated Wrist.xcodeproj is gitignored;
# regenerate it any time with:  DEVELOPMENT_TEAM=YOUR_TEAM_ID xcodegen generate
#
# DEVELOPMENT_TEAM is substituted from the environment at generate time (empty
# when unset). Xcode 14+ requires a signing team even for simulator builds when
# entitlements are present, so set it.
#
# The four source folders (Wrist/, WristWidget/, WristTests/, WristUITests/)
# must exist before generating.
name: Wrist
options:
  bundleIdPrefix: com.ryanswatches
  deploymentTarget: { iOS: "17.0" }
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.0" # Swift 5 language mode (avoids Swift 6 strict-concurrency errors)
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  WristCore: { path: WristCore }
  WristKit: { path: WristKit }
targets:
  Wrist:
    type: application
    platform: iOS
    sources: [Wrist]
    dependencies:
      - package: WristCore
      - package: WristKit
      - target: WristWidget
        embed: true
    info:
      path: Wrist/Info.plist
      properties:
        CFBundleDisplayName: Wrist
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Automatic
        # wrist://picker — opened by the widget's non-interactive areas (WristConstants.openURL)
        CFBundleURLTypes:
          - CFBundleURLName: com.ryanswatches.wrist
            CFBundleURLSchemes: [wrist]
    entitlements:
      path: Wrist/Wrist.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ryanswatches.wrist]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.ryanswatches.wrist.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanswatches.wrist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
  WristWidget:
    type: app-extension
    platform: iOS
    sources: [WristWidget]
    dependencies:
      - package: WristCore
      - package: WristKit
    info:
      path: WristWidget/Info.plist
      properties:
        CFBundleDisplayName: Wrist
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WristWidget/WristWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ryanswatches.wrist]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.ryanswatches.wrist.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanswatches.wrist.widget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
  WristTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WristTests]
    dependencies:
      - target: Wrist
      - package: WristCore
      - package: WristKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanswatches.wrist.tests
  WristUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WristUITests]
    dependencies:
      - target: Wrist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanswatches.wrist.uitests
schemes:
  Wrist:
    build:
      targets:
        Wrist: all
        WristWidget: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets: [WristTests, WristUITests]
    archive:
      config: Release
